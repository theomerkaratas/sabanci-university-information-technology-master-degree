<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Align Items: Flex-Start</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .container {
        height: 500px;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>

                <div class="flex items-center gap-4 mb-6">
          <a
            href="../index.html"

          >
            <svg

            Back
