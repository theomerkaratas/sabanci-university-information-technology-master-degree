<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT 511 – Course Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>
  <body class="bg-white dark:bg-neutral-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 flex flex-col items-center min-h-screen">

    <button
      onclick="document.documentElement.classList.toggle('dark')"
      class="fixed bottom-6 right-6 sm:top-6 sm:bottom-auto p-3 rounded-full bg-white dark:bg-neutral-900 shadow-lg border border-slate-200 dark:border-slate-700 transition-all active:scale-90 hover:scale-110 z-50"
    >
      <svg class="hidden dark:block w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
      </svg>
      <svg class="dark:hidden w-6 h-6 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>

    <main class="max-w-4xl w-full mx-auto bg-white dark:bg-neutral-900 shadow-lg rounded-xl overflow-hidden p-6 sm:p-10 m-4 md:mt-12 border border-slate-200 dark:border-neutral-800">
      
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-6 flex items-center gap-3">
        <span class="h-10 w-1.5 bg-blue-600 rounded-full"></span>
        IT 511 - Course Notes
      </h1>

      <p class="text-lg text-slate-700 dark:text-slate-300 mb-8">
        This folder contains lecture notes and Q&A resources for the course.
      </p>

      <hr class="mb-10 border-slate-200 dark:border-neutral-800" />

      <section>
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-6 flex items-center gap-2">
          📚 Resources
        </h2>
        
        <div class="space-y-4">
          <div class="border-l-4 border-blue-500 pl-4 md:pl-6 py-3 bg-slate-50 dark:bg-neutral-800/40 rounded-r-lg">
            <a href="./LectureNotes" class="text-xl font-bold text-blue-600 dark:text-blue-400 hover:underline inline-flex items-center gap-2">
              <span>📓 Lecture Notes</span>
            </a>
            <p class="mt-1 text-slate-600 dark:text-slate-400">
              Slides and notes from the lectures.
            </p>
          </div>

          <div class="border-l-4 border-green-500 pl-4 md:pl-6 py-3 bg-slate-50 dark:bg-neutral-800/40 rounded-r-lg">
            <a href="./QuestionsAndAnswers" class="text-xl font-bold text-green-600 dark:text-green-400 hover:underline inline-flex items-center gap-2">
              <span>❓ Questions and Answers</span>
            </a>
            <p class="mt-1 text-slate-600 dark:text-slate-400">
              Review questions and answers for exam preparation.
            </p>
          </div>
        </div>
      </section>

    </main>

  </body>
</html>
