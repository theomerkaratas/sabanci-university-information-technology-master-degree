<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT 511 – Course Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
      <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body
    class="bg-slate-50 dark:bg-neutral-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 flex flex-col items-center min-h-screen"
  >
    <button
      onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');"
      class="fixed bottom-6 right-6 sm:top-6 sm:bottom-auto p-3 rounded-full bg-white dark:bg-neutral-900 shadow-lg border border-slate-200 dark:border-slate-700 transition-all active:scale-90 hover:scale-110 z-50 group"
      title="Toggle Dark Mode"
    >
      <svg
        class="hidden dark:block w-6 h-6 text-yellow-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"
        ></path>
      </svg>
      <svg
        class="dark:hidden w-6 h-6 text-slate-700"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        ></path>
      </svg>
    </button>

    <main
      class="max-w-4xl w-full mx-auto bg-white dark:bg-neutral-900 shadow-xl rounded-2xl overflow-hidden p-6 sm:p-10 m-4 md:mt-12 border border-slate-200 dark:border-neutral-800"
    >
      <header
        class="mb-10 pb-8 border-b border-slate-100 dark:border-neutral-800"
      >
        <h1
          class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white mb-6 flex items-center gap-4"
        >
          <div
            class="flex flex-col h-10 sm:h-12 w-2 rounded-full overflow-hidden flex-shrink-0"
          >
            <span class="h-1/2 w-full bg-blue-500"></span>
            <span class="h-1/2 w-full bg-indigo-600"></span>
          </div>
          <span class="leading-tight">IT511 — Course Notes</span>
        </h1>
        <p class="text-slate-700 dark:text-slate-300 text-lg leading-relaxed">
          This folder contains the lecture notes and Q&A resources for the
          <strong>IT 511</strong> course.
        </p>
      </header>

      <section>
        <h2
          class="text-2xl font-bold text-slate-900 dark:text-white mb-6 flex items-center gap-2"
        >
          📚 Resources
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <a
            href="./LectureNotes"
            class="group block p-6 bg-white dark:bg-neutral-800/50 border-l-4 border-blue-500 rounded-r-xl shadow-sm hover:shadow-md transition-all hover:-translate-y-1 border-y border-r border-slate-200 dark:border-neutral-700"
          >
            <div class="flex flex-col h-full">
              <span class="text-3xl mb-4">📓</span>
              <h3
                class="text-xl font-bold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors mb-2"
              >
                Lecture Notes
              </h3>
              <p
                class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed"
              >
                Slides and notes from the lectures.
              </p>
            </div>
          </a>

          <a
            href="./QuestionsAndAnswers"
            class="group block p-6 bg-white dark:bg-neutral-800/50 border-l-4 border-green-500 rounded-r-xl shadow-sm hover:shadow-md transition-all hover:-translate-y-1 border-y border-r border-slate-200 dark:border-neutral-700"
          >
            <div class="flex flex-col h-full">
              <span class="text-3xl mb-4">❓</span>
              <h3
                class="text-xl font-bold text-slate-900 dark:text-white group-hover:text-green-600 dark:group-hover:text-green-400 transition-colors mb-2"
              >
                Questions and Answers
              </h3>
              <p
                class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed"
              >
                Review questions and answers for exam preparation.
              </p>
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
