site_name: Sabanci University Information Technology Master Degree
site_url: https://theomerkaratas.github.io/sabanci-university-information-technology-master-degree/
site_description: Sabanci University Master of Science in Information Technology Coursework and Projects
exclude_docs: |
  IT537/menuproject/**
  IT537/Practices/**
repo_name: theomerkaratas/sabanci-university-information-technology-master-degree
repo_url: https://github.com/theomerkaratas/sabanci-university-information-technology-master-degree

plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: tr
          name: Türkçe
          build: true
          nav_translations:
            Introduction: Giriş
            Main: Ana Sayfa
            Lecture Notes: Ders Notları
            Q&A: Soru-Cevap
            Projects: Projeler
            Bank Account: Banka Hesabı
            Cheatsheet: Özet Notlar
            AdvanceCalculator Project: Gelişmiş Hesap Makinesi Projesi
            Overview: Genel Bakış
            Graduation Report: Mezuniyet Raporu
            Chapters: Bölümler
            Homeworks: Ödevler
            Lab 1: Laboratuvar 1
            Lab 2: Laboratuvar 2
            Lab 3: Laboratuvar 3
            Lab 4: Laboratuvar 4
            Cheatsheets: Özet Notlar
            1. Software Ubiquity and Modern Dependency: Yazılımın Yaygınlığı ve Modern Bağımlılık
            2. Security Posture & DevSecOps: Güvenlik Duruşu ve DevSecOps
            2.1. Personal and Corporate Cyber Hygiene: Kişisel ve Kurumsal Siber Hijyen
            2.2. Introduction to DevSecOps: DevSecOps'a Giriş
            2.3. Understanding PAM and Password Complexity Policy: PAM ve Parola Karmaşıklığı Politikası
            2.4. Cybersecurity Culture & Human Behaviour: Siber Güvenlik Kültürü ve İnsan Davranışı

copyright: Copyright &copy; 2026 Ömer Karataş

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  icon:
    alternate: material/web
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

nav:
  - Introduction: index.md
  - IT501:
      - Main: IT501/README.md
  - IT511:
      - Main: IT511/README.md
      - Lecture Notes: IT511/Notes/LectureNotes/README.md
      - Q&A: IT511/Notes/QuestionsAndAnswers/README.md
  - IT524:
      - Main: IT524/README.md
      - Projects:
          - Lecture Notes: IT524/LectureNotes/README.md
          - Bank Account: IT524/BankAccountProject/README.md
          - FootJoy: IT524/FootJoy/README.md
  - IT526:
      - Main: IT526/README.md
      - Lecture Notes: IT526/LectureNotes/README.md
      - Cheatsheet: IT526/Cheatsheet/README.md
      - AdvanceCalculator Project: IT526/AdvanceCalculator/README.md
  - IT535: IT535/README.md
  - IT537:
      - Main: IT537/README.md
  - IT553: IT553/README.md
  - IT563: IT563/README.md
  - SEC509:
      - Main: SEC509/README.md
      - Chapters:
          - 1. Software Ubiquity and Modern Dependency: SEC509/Documents/chapter1.md
          - 2. Security Posture & DevSecOps: SEC509/Documents/chapter2.md
          - 2.1. Personal and Corporate Cyber Hygiene: SEC509/Documents/chapter2-1.md
          - 2.2. Introduction to DevSecOps: SEC509/Documents/chapter2-2.md
          - 2.3. Understanding PAM and Password Complexity Policy: SEC509/Documents/chapter2-3.md
          - 2.4. Cybersecurity Culture & Human Behaviour: SEC509/Documents/chapter2-4.md
      - Homeworks:
          - Overview: SEC509/Homeworks/README.md
          - Lab 1: SEC509/Homeworks/Lab1/README.md
          - Lab 2: SEC509/Homeworks/Lab2/README.md
          - Lab 3: SEC509/Homeworks/Lab3/README.md
          - Lab 4: SEC509/Homeworks/Lab4/README.md
      - Cheatsheets: SEC509/Cheatsheets/README.md
  - IT592:
      - Overview: IT592/README.md
      - Graduation Report: IT592/graduation_report.md
