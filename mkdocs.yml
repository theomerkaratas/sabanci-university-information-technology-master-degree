site_name: Sabanci University Information Technology Master Degree
site_url: https://theomerkaratas.github.io/sabanci-university-information-technology-master-degree/
site_description: https://theomerkaratas.github.io/sabanci-university-information-technology-master-degree/ University Master of Science in Information Technology Coursework and Projects
repo_name: theomerkaratas/sabanci-university-information-technology-master-degree
repo_url: https://github.com/theomerkaratas/sabanci-university-information-technology-master-degree

plugins:
  - i18n:
      default_language: en
      languages:
        en: 
          name: English
          link: /
          build: true
        tr:
          name: Türkçe
          link: /tr/
          build: true
  - search:
      lang:
        - en
        - tr

copyright: Copyright &copy; 2026 Ömer Karataş

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Türkçe
      link: /tr/
      lang: tr

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

nav:
  - Introduction: index.md
  - IT501:
      - Main: IT501/README.md
      - Projects:
          - Blackjack: IT501/blackjack/README.md
          - Calculator: IT501/calculator/README.md
          - Caesar Cipher: IT501/ceaser-cipher/README.md
          - Coffee Machine: IT501/coffee-machine/README.md
          - Hangman: IT501/hangman/README.md
          - Higher Lower: IT501/higher-lower/README.md
  - IT511:
