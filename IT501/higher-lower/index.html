<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher-Lower - IT 501</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
      <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body
    class="bg-slate-50 dark:bg-neutral-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center p-4"
  >
    <main
      class="max-w-2xl w-full bg-white dark:bg-neutral-900 shadow-xl rounded-2xl p-8 mt-12 border border-slate-200 dark:border-neutral-800"
    >
      <a
        href="../"
        class="text-blue-600 dark:text-blue-400 hover:underline mb-6 inline-block font-medium"
        >← Back to IT501</a
      >
      <h1 class="text-3xl font-extrabold mb-4">📊 Higher-Lower</h1>
      <p class="text-lg text-slate-700 dark:text-slate-300 mb-8">
        A trivia game based on comparing follower counts of famous accounts with
        comprehensive score tracking.
      </p>

      <div
        class="bg-slate-50 dark:bg-neutral-800 p-6 rounded-xl border border-slate-200 dark:border-neutral-700"
      >
        <h2 class="text-xl font-bold mb-3">How to Run</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">
          Make sure you have Python installed on your system.
        </p>
        <code
          class="block bg-neutral-900 text-slate-100 p-4 rounded-lg font-mono text-sm leading-relaxed"
        >
          python main.py
        </code>
      </div>
    </main>
  </body>
</html>
