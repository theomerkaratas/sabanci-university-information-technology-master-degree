<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack - IT 501</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
      <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body
    class="bg-slate-50 dark:bg-neutral-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center p-4"
  >
    <main
      class="max-w-2xl w-full bg-white dark:bg-neutral-900 shadow-xl rounded-2xl p-8 mt-12 border border-slate-200 dark:border-neutral-800"
    >

                <div class="flex items-center gap-4 mb-6">
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-neutral-800 text-slate-700 dark:text-slate-300 text-sm font-semibold rounded-xl border border-slate-200 dark:border-neutral-700 shadow-sm hover:shadow-md hover:bg-slate-50 dark:hover:bg-neutral-700 transition-all active:scale-95"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            Back
          </a>
        </div>

      
      <h1 class="text-3xl font-extrabold mb-4">♠️ Blackjack</h1>
      <p class="text-lg text-slate-700 dark:text-slate-300 mb-8">
        A classic card game implementation following standard Blackjack rules
        with an intelligent scoring system.
      </p>

      <div
        class="bg-slate-50 dark:bg-neutral-800 p-6 rounded-xl border border-slate-200 dark:border-neutral-700"
      >
        <h2 class="text-xl font-bold mb-3">How to Run</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">
          Make sure you have Python installed on your system.
        </p>
        <code
          class="block bg-neutral-900 text-slate-100 p-4 rounded-lg font-mono text-sm leading-relaxed"
        >
          python main.py
        </code>
      </div>
    </main>
  </body>
</html>
