<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT-526 FINE DINING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            max-width: 400px;
            width: 100%;
            border: 1px solid #333;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #ff8533;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #d32f2f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .user-type {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .user-type button {
            flex: 1;
            padding: 10px;
            background-color: #333;
            border: 2px solid #555;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-type button.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>IT-526 <span>FINE DINING</span></h1>
                <p>Please login to continue</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="user-type">
                <button type="button" class="active" id="customerBtn">Customer</button>
                <button type="button" id="adminBtn">Admin</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-footer">
                <p style="color: var(--text-secondary); margin-top: 20px;">
                    Demo: customer/customer123 or admin/admin123
                </p>
            </div>
        </div>
    </div>

    <script src="dataManager.js"></script>
    <script>
        let userType = 'customer';
        const customerBtn = document.getElementById('customerBtn');
        const adminBtn = document.getElementById('adminBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginForm = document.getElementById('loginForm');

        // User type selection
        customerBtn.addEventListener('click', () => {
            userType = 'customer';
            customerBtn.classList.add('active');
            adminBtn.classList.remove('active');
        });

        adminBtn.addEventListener('click', () => {
            userType = 'admin';
            adminBtn.classList.add('active');
            customerBtn.classList.remove('active');
        });

        // Login form submission
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Demo credentials
            const credentials = {
                customer: { username: 'customer', password: 'customer123' },
                admin: { username: 'admin', password: 'admin123' }
            };

            if (username === credentials[userType].username && 
                password === credentials[userType].password) {
                
                // Store user session
                localStorage.setItem('user', JSON.stringify({
                    username: username,
                    type: userType,
                    loginTime: new Date().toISOString()
                }));

                // Log login activity to CSV
                DataManager.logLogin(username, userType);

                // Redirect based on user type
                if (userType === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                errorMessage.textContent = 'Invalid username or password!';
                errorMessage.style.display = 'block';
                
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
