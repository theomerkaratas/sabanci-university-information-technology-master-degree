<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - IT-537 FINE DINING</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding: 20px;
        background-color: var(--card-bg);
        border-radius: var(--border-radius);
      }

      .admin-header h1 {
        font-size: 1.8rem;
      }

      .logout-btn {
        background-color: #d32f2f;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
      }

      .logout-btn:hover {
        background-color: #b71c1c;
      }

      .export-btn {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.3s;
        white-space: nowrap;
      }

      .export-btn:hover {
        background-color: #ff8533;
        transform: translateY(-2px);
      }

      .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background-color: var(--card-bg);
        padding: 25px;
        border-radius: var(--border-radius);
        border: 1px solid #333;
        text-align: center;
      }

      .stat-card h3 {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 10px;
      }

      .stat-card .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      .orders-section {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: var(--border-radius);
        border: 1px solid #333;
      }

      .orders-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .orders-header h2 {
        font-size: 1.5rem;
      }

      .filter-buttons {
        display: flex;
        gap: 10px;
      }

      .filter-btn {
        padding: 8px 16px;
        background-color: #333;
        color: var(--text-color);
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .filter-btn.active {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
      }

      .orders-table {
        width: 100%;
        border-collapse: collapse;
      }

      .orders-table th {
        background-color: #000;
        padding: 15px;
        text-align: left;
        font-weight: 600;
        border-bottom: 2px solid var(--primary-color);
      }

      .orders-table td {
        padding: 15px;
        border-bottom: 1px solid #333;
      }

      .orders-table tr:hover {
        background-color: rgba(255, 107, 0, 0.1);
      }

      .order-items {
        font-size: 0.9rem;
        color: var(--text-secondary);
      }

      .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-pending {
        background-color: #ff9800;
        color: white;
      }

      .status-preparing {
        background-color: #2196f3;
        color: white;
      }

      .status-ready {
        background-color: #4caf50;
        color: white;
      }

      .status-completed {
        background-color: #9e9e9e;
        color: white;
      }

      .action-select {
        padding: 6px 10px;
        background-color: #333;
        color: var(--text-color);
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
      }

      .no-orders {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
      }

      .refresh-btn {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
      }

      .refresh-btn:hover {
        background-color: #ff8533;
      }

      @media (max-width: 768px) {
        .admin-header {
          flex-direction: column;
          gap: 15px;
        }

        .admin-header > div:last-child {
          width: 100%;
          flex-wrap: wrap;
          justify-content: center;
        }

        .export-btn {
          font-size: 0.75rem;
          padding: 6px 10px;
        }

        .orders-table {
          display: block;
          overflow-x: auto;
        }

        .filter-buttons {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <div class="admin-header">
        <div>
          <h1>IT-526 <span>FINE DINING</span> - Admin Panel</h1>
          <p style="color: var(--text-secondary); margin-top: 5px">
            Welcome, <span id="adminUsername"></span>
          </p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <button
            class="export-btn"
            id="exportOrdersBtn"
            title="Export Orders to CSV"
          >
            📥 Orders CSV
          </button>
          <button
            class="export-btn"
            id="exportLoginBtn"
            title="Export Login Activity to CSV"
          >
            📥 Login CSV
          </button>
          <button
            class="export-btn"
            id="exportAllBtn"
            title="Export All Data to CSV"
          >
            📥 All Data
          </button>
          <button
            class="export-btn"
            id="importBtn"
            title="Import Orders from CSV"
          >
            📤 Import
          </button>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="stats-container">
        <div class="stat-card">
          <h3>Total Orders</h3>
          <div class="stat-value" id="totalOrders">0</div>
        </div>
        <div class="stat-card">
          <h3>Pending Orders</h3>
          <div class="stat-value" id="pendingOrders">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <div class="stat-value" id="totalRevenue">0₺</div>
        </div>
        <div class="stat-card">
          <h3>Today's Orders</h3>
          <div class="stat-value" id="todayOrders">0</div>
        </div>
      </div>

      <div class="orders-section">
        <div class="orders-header">
          <h2>Orders Management</h2>
          <div style="display: flex; gap: 10px">
            <div class="filter-buttons">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="pending">Pending</button>
              <button class="filter-btn" data-filter="preparing">
                Preparing
              </button>
              <button class="filter-btn" data-filter="ready">Ready</button>
              <button class="filter-btn" data-filter="completed">
                Completed
              </button>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
          </div>
        </div>

        <div id="ordersTableContainer">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Table</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr>
                <td colspan="8" class="no-orders">No orders yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" accept=".csv" style="display: none" />

    <script src="dataManager.js"></script>
    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user || user.type !== "admin") {
        window.location.href = "/";
      }

      document.getElementById("adminUsername").textContent = user.username;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "/";
      });

      document
        .getElementById("exportOrdersBtn")
        .addEventListener("click", () => {
          DataManager.exportOrdersToCSV();
        });

      document
        .getElementById("exportLoginBtn")
        .addEventListener("click", () => {
          DataManager.exportLoginActivityToCSV();
        });

      document.getElementById("exportAllBtn").addEventListener("click", () => {
        DataManager.exportAllDataToCSV();
      });

      document.getElementById("importBtn").addEventListener("click", () => {
        document.getElementById("fileInput").click();
      });

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          DataManager.importOrdersFromCSV(file);
        }
      });

      let currentFilter = "all";

      async function loadOrders() {
        const orders = await DataManager.fetchOrdersFromServer();
        updateStats(orders);
        displayOrders(orders, currentFilter);
      }

      function updateStats(orders) {
        const today = new Date().toDateString();
        const todayOrders = orders.filter(
          (order) => new Date(order.date).toDateString() === today,
        );
        const pendingOrders = orders.filter(
          (order) => order.status === "pending",
        );
        const totalRevenue = orders.reduce(
          (sum, order) => sum + order.total,
          0,
        );

        document.getElementById("totalOrders").textContent = orders.length;
        document.getElementById("pendingOrders").textContent =
          pendingOrders.length;
        document.getElementById("totalRevenue").textContent =
          totalRevenue + "₺";
        document.getElementById("todayOrders").textContent = todayOrders.length;
      }

      function displayOrders(orders, filter) {
        const tbody = document.getElementById("ordersTableBody");

        let filteredOrders = orders;
        if (filter !== "all") {
          filteredOrders = orders.filter((order) => order.status === filter);
        }

        if (filteredOrders.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="8" class="no-orders">No orders found</td></tr>';
          return;
        }

        filteredOrders.sort((a, b) => new Date(b.date) - new Date(a.date));

        tbody.innerHTML = filteredOrders
          .map(
            (order) => `
                <tr>
                    <td><strong>#${order.id}</strong></td>
                    <td><strong style="color: var(--primary-color);">Table ${order.table || "N/A"}</strong></td>
                    <td>${order.customer}</td>
                    <td class="order-items">
                        ${order.items
                          .map(
                            (item) =>
                              `${item.name}${item.cookingLevel ? ` (${item.cookingLevel})` : ""}`,
                          )
                          .join(", ")}
                    </td>
                    <td><strong>${order.total}₺</strong></td>
                    <td>${new Date(order.date).toLocaleString()}</td>
                    <td><span class="status-badge status-${order.status}">${order.status.toUpperCase()}</span></td>
                    <td>
                        <select class="action-select" onchange="updateOrderStatus('${order.id}', this.value)">
                            <option value="">Change Status</option>
                            <option value="pending" ${order.status === "pending" ? "disabled" : ""}>Pending</option>
                            <option value="preparing" ${order.status === "preparing" ? "disabled" : ""}>Preparing</option>
                            <option value="ready" ${order.status === "ready" ? "disabled" : ""}>Ready</option>
                            <option value="completed" ${order.status === "completed" ? "disabled" : ""}>Completed</option>
                        </select>
                    </td>
                </tr>
            `,
          )
          .join("");
      }

      window.updateOrderStatus = async function (orderId, newStatus) {
        if (!newStatus) return;

        await DataManager.updateOrderStatusOnServer(orderId, newStatus);
        loadOrders();

        showToast(`Order #${orderId} status updated to ${newStatus}`);
      };

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          loadOrders();
        });
      });

      document.getElementById("refreshBtn").addEventListener("click", () => {
        loadOrders();
        showToast("Orders refreshed");
      });

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        toast.style.position = "fixed";
        toast.style.top = "100px";
        toast.style.right = "20px";
        toast.style.backgroundColor = "var(--primary-color)";
        toast.style.color = "white";
        toast.style.padding = "15px 25px";
        toast.style.borderRadius = "8px";
        toast.style.boxShadow = "0 4px 12px rgba(0,0,0,0.3)";
        toast.style.zIndex = "10000";
        toast.style.opacity = "0";
        toast.style.transform = "translateX(400px)";
        toast.style.transition = "all 0.3s ease";
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateX(0)";
        }, 100);

        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateX(400px)";
          setTimeout(() => toast.remove(), 300);
        }, 2000);
      }

      loadOrders();

      setInterval(loadOrders, 30000);
    </script>
  </body>
</html>
