<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - IT-537 FINE DINING</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-box {
        background-color: var(--card-bg);
        padding: 40px;
        border-radius: var(--border-radius);
        max-width: 400px;
        width: 100%;
        border: 1px solid #333;
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-header h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
      }

      .login-header p {
        color: var(--text-secondary);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-color);
        font-weight: 600;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        background-color: #333;
        border: 1px solid #555;
        border-radius: 8px;
        color: var(--text-color);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        border-color: var(--primary-color);
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.3s;
      }

      .login-btn:hover {
        background-color: #ff8533;
      }

      .login-footer {
        text-align: center;
        margin-top: 20px;
      }

      .login-footer a {
        color: var(--primary-color);
        text-decoration: none;
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      .error-message {
        background-color: #d32f2f;
        color: white;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }

      .user-type {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .user-type button {
        flex: 1;
        padding: 10px;
        background-color: #333;
        border: 2px solid #555;
        color: var(--text-color);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .user-type button.active {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h1 id="brandHeader">IT-537 <span>FINE DINING</span></h1>
          <p id="modeDescription">Please login to continue</p>
        </div>

        <div
          class="error-message"
          id="errorMessage"
          style="
            background-color: #d32f2f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
          "
        ></div>
        <div
          class="success-message"
          id="successMessage"
          style="
            background-color: #2e7d32;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
          "
        ></div>

        <div class="user-type" id="userTypeContainer">
          <button type="button" class="active" id="customerBtn">
            Customer
          </button>
          <button type="button" id="adminBtn">Admin</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              required
              placeholder="Enter username"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              placeholder="Enter password"
            />
          </div>

          <button type="submit" class="login-btn" id="submitBtn">Login</button>
        </form>

        <div class="login-footer">
          <p style="margin-top: 15px; color: var(--text-secondary)">
            <span id="toggleMsg">Don't have an account?</span>
            <a
              href="#"
              id="toggleMode"
              style="
                color: var(--primary-color);
                text-decoration: none;
                font-weight: bold;
              "
              >Create Account</a
            >
          </p>
          <p style="color: var(--text-secondary); margin-top: 20px">
            Demo: customer/customer123 or admin/admin123
          </p>
        </div>
      </div>
    </div>

    <script src="dataManager.js"></script>
    <script>
      let userType = "customer";
      let isRegisterMode = false;

      const customerBtn = document.getElementById("customerBtn");
      const adminBtn = document.getElementById("adminBtn");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");
      const loginForm = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const toggleMode = document.getElementById("toggleMode");
      const toggleMsg = document.getElementById("toggleMsg");
      const modeDescription = document.getElementById("modeDescription");
      const userTypeContainer = document.getElementById("userTypeContainer");

      customerBtn.addEventListener("click", () => {
        userType = "customer";
        customerBtn.classList.add("active");
        adminBtn.classList.remove("active");
      });

      adminBtn.addEventListener("click", () => {
        userType = "admin";
        adminBtn.classList.add("active");
        customerBtn.classList.remove("active");
      });

      function handleToggle(e) {
        if (e) e.preventDefault();
        isRegisterMode = !isRegisterMode;

        if (isRegisterMode) {
          modeDescription.textContent = "Create a new customer account";
          submitBtn.textContent = "Register";
          toggleMsg.textContent = "Already have an account?";
          toggleMode.textContent = "Login";
          userTypeContainer.style.display = "none";
          userType = "customer";
        } else {
          modeDescription.textContent = "Please login to continue";
          submitBtn.textContent = "Login";
          toggleMsg.textContent = "Don't have an account?";
          toggleMode.textContent = "Create Account";
          userTypeContainer.style.display = "flex";
        }
      }

      toggleMode.addEventListener("click", handleToggle);

      function showMessage(msg, isError = true) {
        const target = isError ? errorMessage : successMessage;
        target.textContent = msg;
        target.style.display = "block";
        setTimeout(() => {
          target.style.display = "none";
        }, 3000);
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          if (isRegisterMode) {
            await DataManager.registerUser({
              username,
              password,
              type: "customer",
            });
            showMessage("Account created! You can now login.", false);
            loginForm.reset();
            isRegisterMode = false;
            toggleMode.click();
          } else {
            const userData = await DataManager.loginUser({
              username,
              password,
            });

            localStorage.setItem(
              "user",
              JSON.stringify({
                username: userData.username,
                type: userData.type,
                loginTime: new Date().toISOString(),
              }),
            );

            DataManager.logLogin(userData.username, userData.type);

            window.location.href =
              userData.type === "admin" ? "admin.html" : "/main";
          }
        } catch (error) {
          showMessage(error.message);
        }
      });
    </script>
  </body>
</html>
