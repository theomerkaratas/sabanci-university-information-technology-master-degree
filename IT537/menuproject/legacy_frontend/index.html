<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - IT-537 FINE DINING</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h1 id="brandHeader">IT-537 <span>FINE DINING</span></h1>
          <p id="modeDescription">Please login to continue</p>
        </div>

        <div
          class="error-message"
          id="errorMessage"
          style="
            background-color: #d32f2f;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
          "
        ></div>
        <div
          class="success-message"
          id="successMessage"
          style="
            background-color: #2e7d32;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
          "
        ></div>

        <div class="user-type" id="userTypeContainer">
          <button type="button" class="active" id="customerBtn">
            Customer
          </button>
          <button type="button" id="adminBtn">Admin</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              required
              placeholder="Enter username"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              placeholder="Enter password"
            />
          </div>

          <button type="submit" class="login-btn" id="submitBtn">Login</button>
        </form>

        <div class="login-footer">
          <p style="margin-top: 15px; color: var(--text-secondary)">
            <span id="toggleMsg">Don't have an account?</span>
            <a
              href="#"
              id="toggleMode"
              style="
                color: var(--primary-color);
                text-decoration: none;
                font-weight: bold;
              "
              >Create Account</a
            >
          </p>
          <p style="color: var(--text-secondary); margin-top: 20px">
            Demo: customer/customer123 or admin/admin123
          </p>
        </div>
      </div>
    </div>

    <script src="dataManager.js"></script>
    <script src="index.js"></script>
  </body>
</html>
