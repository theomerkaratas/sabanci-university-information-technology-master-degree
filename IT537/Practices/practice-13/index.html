<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CSS Positioning Exercise</title>
    <style>
      html {
        background-color: black;
        color: white;
      }

      .blue-box {
        background-color: blue;
        width: 500px;
        height: 300px;
        position: relative;
        top: 200px;
        left: 200px;
        z-value: -1;
      }

      .red-circle {
        background-color: red;
        width: 200px;
        height: 200px;
        border-radius: 200px;
        position: absolute;
        top: 150px;
        left: 250px;
      }
    </style>
  </head>

  <body>
    <div class="blue-box">
      <div class="red-circle"></div>
    </div>
  </body>
</html>
