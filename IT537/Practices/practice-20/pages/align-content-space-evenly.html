<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Align Content: Space-Evenly</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .container {
        height: 600px;
        flex-wrap: wrap;
        align-content: space-evenly;
        width: 400px;
      }
    </style>
  </head>
  <body>
    <nav><a href="../index.html">← Back to Menu</a></nav>
    <h1>align-content: space-evenly</h1>
    <p>
      Lines are distributed so that the spacing between any two lines is equal.
    </p>
    <div class="container">
      <div class="red">Red</div>
      <div class="orange">Orange</div>
      <div class="yellow">Yellow</div>
      <div class="green">Green</div>
      <div class="blue">Blue</div>
      <div class="indigo">Indigo</div>
      <div class="purple">Purple</div>
    </div>
  </body>
</html>
