<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Justify Content: Space-Between</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .container {
        justify-content: space-between;
      }
    </style>
  </head>
  <body>

                <div class="flex items-center gap-4 mb-6">
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-neutral-800 text-slate-700 dark:text-slate-300 text-sm font-semibold rounded-xl border border-slate-200 dark:border-neutral-700 shadow-sm hover:shadow-md hover:bg-slate-50 dark:hover:bg-neutral-700 transition-all active:scale-95"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            Back
          </a>
        </div>

    
    <h1>justify-content: space-between</h1>
    <p>Items are evenly distributed; first item at start, last item at end.</p>
    <div class="container">
      <div class="red">Red</div>
      <div class="orange">Orange</div>
      <div class="yellow">Yellow</div>
      <div class="green">Green</div>
      <div class="blue">Blue</div>
    </div>
  </body>
</html>
