<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Practice 6</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-all duration-300 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-white dark:bg-slate-900 p-12 text-center font-bold text-2xl shadow-2xl rounded-3xl ring-1 ring-slate-200 dark:ring-slate-800 max-w-md w-full"
    >
      <p class="mb-2">Dark mode</p>
      <div class="text-3xl">
        <span class="dark:hidden text-indigo-600">disabled</span>
        <span class="hidden dark:inline text-purple-400">enabled</span>
      </div>

      <button
        id="toggleDark"
        class="w-full px-6 py-4 text-lg font-bold mt-10 text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-2xl shadow-lg shadow-indigo-500/25 transition-all active:scale-95"
        onclick="document.documentElement.classList.toggle('dark')"
      >
        Toggle Theme
      </button>
    </div>
  </body>
</html>
