<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      html {
        background-color: black;
        color: #e8e2db;
      }

      .flag {
        background-color: #547792;
        height: 600px;
        width: 900px;
        position: absolute;
        top: 10px;
        left: 10px;
        z-value: -1;
      }

      body {
        text-align: center;
      }

      div.flag > p {
        font-size: 75px;
        margin-top: 0px;
      }

      .flag > div {
        background-color: #fab95b;
        position: absolute;
        width: 900px;
        height: 300px;
        top: 150px;
      }

      div > div > p {
        background-color: #e8e2db;
        margin-top: 50px;
        font-size: 75px;
        color: #1a3263;
        height: 200px;
        width: 200px;
        border-radius: 200px;
        position: relative;
        left: 350px;
      }
    </style>
  </head>

  <body>

                <div class="flex items-center gap-4 mb-6">
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white dark:bg-neutral-800 text-slate-700 dark:text-slate-300 text-sm font-semibold rounded-xl border border-slate-200 dark:border-neutral-700 shadow-sm hover:shadow-md hover:bg-slate-50 dark:hover:bg-neutral-700 transition-all active:scale-95"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            Back
          </a>
        </div>

    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
